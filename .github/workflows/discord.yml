name: Discord Notifications

on:
  push: 
jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send embed message to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_SHA: ${{ github.sha }}
          AUTHOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          SHORT_SHA=${COMMIT_SHA:0:8}
          CURRENT_DATE=$(date +"%Y-%m-%d %H:%M:%S") 
          REPO_NAME=${REPO#*/}

          case "$BRANCH" in
            main|master)
              COLOR=3447003      # Azul (#3498DB)
              ;;
            
            develop|dev|desarrollo)
              COLOR=15844367     # Amarillo (#F1C40F)
              ;;
            
            feature/*)
              COLOR=65336        # Verde claro (#00FFA8)
              FEATURE_NAME=$(echo "$BRANCH" | cut -d'/' -f2)
              BRANCH="Feature: $FEATURE_NAME"
              ;;
            
            hotfix/*|fix/*)
              COLOR=13632027     # Rojo (#D0021B)
              FEATURE_NAME=$(echo "$BRANCH" | cut -d'/' -f2)
              BRANCH="Hotfix: $FEATURE_NAME"
              ;;
            
            release/*)
              COLOR=15277667     # Rosa (#E91E63)
              FEATURE_NAME=$(echo "$BRANCH" | cut -d'/' -f2)
              BRANCH="Release: $FEATURE_NAME"
              ;;
            
            *)
              COLOR=10070709     # Gris (#99A3A4)
              ;;
          esac
          
          JSON_PAYLOAD=$(jq -n \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg msg "$COMMIT_MSG" \
            --arg url "$COMMIT_URL" \
            --arg repo "$REPO_NAME" \
            --arg sha "$SHORT_SHA" \
            --arg date "$CURRENT_DATE" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: "🚀 Nuevo Commit en \($repo)",
                url: $url,
                color: $color,
                fields: [
                  { name: "👤 Autor", value: $author, inline: true },
                  { name: "🌿 Rama", value: $branch, inline: true },
                  { name: "🔢 Commit ID", value: ("[`" + $sha + "`](" + $url + ")"), inline: true },
                  { name: "📝 Mensaje", value: $msg }
                ],
                footer: { text: "GitHub Actions • \($date)" }
              }]
            }')

          curl -H "Content-Type: application/json" -X POST -d "$JSON_PAYLOAD" "$DISCORD_WEBHOOK"
